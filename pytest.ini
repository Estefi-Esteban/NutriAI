[pytest]
# Solo se ejecutan las suites mantenidas del proyecto.
# Los scripts de diagnóstico de la raíz y las copias de parches/backups
# no deben mezclarse con la suite oficial.
testpaths = tests backend/rag
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .pytest_cache __pycache__ venv .venv logs data frontend mobile_app _backups _patch_* node_modules dist build
addopts = -ra --import-mode=importlib

